name: Build CUDA Image

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA version (nvidia/cuda tag prefix, ubuntu24.04 base)'
        required: false
        default: '13.0.3'
        type: string
      cuda_architectures:
        description: 'CUDA architectures'
        required: false
        default: '86'
        type: string
      go_version:
        description: 'Go version'
        required: false
        default: '1.27.3'
        type: string
  push:
    branches: [main]
    paths:
      - 'Dockerfile.cuda'

env:
  REGISTRY: git.cisnt.uk
  IMAGE_TAG: build-cuda

concurrency:
  # One llama.cpp build at a time across the repository: CI, release
  # validation and the CUDA image share this group, and a run that arrives
  # while another is going waits for it rather than cancelling it.
  group: llama-go-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push CUDA image
        uses: https://git.cisnt.uk/actions/docker-publish@v1
        with:
          registry: ${{ env.REGISTRY }}
          password: ${{ secrets.PACKAGE_TOKEN }}
          file: Dockerfile.cuda
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            CUDA_VERSION=${{ github.event.inputs.cuda_version || '13.0.3' }}
            CUDA_ARCHITECTURES=${{ github.event.inputs.cuda_architectures || '86' }}
            GO_VERSION=${{ github.event.inputs.go_version || '1.27.3' }}
